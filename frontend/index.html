<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Ladder</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <header class="flex justify-start px-4 md:px-0 md:justify-center items-center bg-red-400">
        <h1 class="select-none text-3xl text-center py-4 text-slate-100 tracking-tightest font-Inter font-bold">
            NRLLadder.Live
        </h1>
        <svg id="dark-btn" class="absolute top-4 right-10 hover:cursor-pointer" width="36px" height="36px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 0H8V2H10V0Z" fill="#ffffff"/>
            <path d="M14.6569 2.75735L13.2426 1.34314L11.8284 2.75735L13.2426 4.17157L14.6569 2.75735Z" fill="#ffffff"/>
            <path d="M4.75735 1.34314L6.17157 2.75735L4.75735 4.17157L3.34314 2.75735L4.75735 1.34314Z" fill="#ffffff"/>
            <path d="M16 6H14V8H16V6Z" fill="#ffffff"/>
            <path d="M7.87398 10C7.42994 8.27477 5.86384 7 4 7C1.79086 7 0 8.79086 0 11V15H15V14C15 11.7909 13.2091 10 11 10H7.87398Z" fill="#ffffff"/>
            <path d="M12 7C12 7.35064 11.9398 7.68722 11.8293 8H9.19666C8.55829 6.89629 7.57872 6.01456 6.40147 5.49978C6.92022 4.6032 7.88967 4 9 4C10.6569 4 12 5.34315 12 7Z" fill="#ffffff"/>
        </svg>
        <svg id="light-btn" class="hidden absolute top-4 right-10 hover:cursor-pointer" width="36px" height="36px" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 8.00002C0 4.75562 1.93132 1.9623 4.70701 0.707031L5.65436 1.65438C5.2352 2.51383 5 3.47946 5 4.50002C5 6.17206 5.63133 7.69665 6.66862 8.84841C6.33637 9.19511 6.04534 9.58161 5.80334 10H4C2.73913 10 1.5691 10.3889 0.603335 11.0534C0.214525 10.1125 0 9.08132 0 8.00002Z" fill="#ffffff"/>
            <path d="M7.99033 16L7.98148 16H0C0 13.7909 1.79086 12 4 12H7.12602C7.19635 11.7267 7.29484 11.4648 7.41819 11.2174C8.07364 9.90294 9.43137 9 11 9C12.6513 9 14.0689 10.0006 14.6795 11.4286C14.767 11.6332 14.8379 11.8465 14.8906 12.0669C14.9621 12.3663 15 12.6787 15 13V16H8.01852L8.00967 16H7.99033Z" fill="#ffffff"/>
            <path d="M11.5 7L9 4.5L11.5 2L14 4.5L11.5 7Z" fill="#ffffff"/>
        </svg>
    </header>
    <main class="bg-slate-100 dark:bg-neutral-950 w-full h-full flex gap-8
                flex-col items-center
                desktop:flex-row desktop:py-6 desktop:items-start transition-all duration-200 ease-in-out">
        
        <!-- Ladder -->
        <section class="ladder-row-container relative w-9/10 py-10 flex flex-col font-geist 
                        desktop:max-w-325 desktop:ml-10">
           
            <!-- Points Header -->
            <div class="flex flex-row justify-end">
                <span class="inline-block min-w-52 md:min-w-[320px]"></span>
                <span class="bg-slate-100 dark:bg-neutral-950 ml-8 h-12 inline-block w-[calc(100%-900px)]"></span>
                <ul class="stats-col no-scrollbar h-12 desktop:h-16 flex flex-nowrap overflow-x-auto w-full max-w-120 dark:text-zinc-100 bg-red-400 rounded-tr-xl rounded-tl-xl">
                    <li class="h-full flex flex-none justify-center items-center w-12">P</li>
                    <li id="win-sort" class="h-full flex flex-none justify-center items-center w-12 font-bold hover:cursor-pointer hover:bg-rose-300 transition-all duration-200 ease-in-out">W</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">D</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">L</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">B</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">PF</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">PA</li>
                    <li class="h-full flex flex-none justify-center items-center w-12">+/-</li>
                    <li id="percent-sort" class="h-full flex flex-none justify-center items-center w-12 font-bold hover:cursor-pointer hover:bg-rose-300 transition-all duration-200 ease-in-out">%</li>
                    <li id="points-sort" class="h-full flex flex-none justify-center items-center w-12 font-bold hover:cursor-pointer hover:bg-rose-300 transition-all duration-200 ease-in-out">Pts</li>
                </ul>
            </div>

        </section>
        
        <!-- Games -->
        <section class="games-container w-95/100 pb-10 font-geist flex flex-col justify-start items-center gap-4
                        lg:max-desktop:grid lg:grid-cols-2 lg:grid-rows-4 lg:gap-y-6 lg:place-items-center
                        desktop:pt-10 desktop:grid-none desktop:w-full desktop:max-h-325 desktop:overflow-y-auto desktop:mt-10
                        ">
        </section>
    </div>
</body>
</html>

<script src="js/theme.js"></script>
<script src="js/updateLoop.js" type="module"></script>
<script src="js/ladderScroll.js"></script>
